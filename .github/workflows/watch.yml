name: Barber slot watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for earlier slots
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.GMAIL_USER }}
          CURRENT_APPOINTMENT: ${{ vars.CURRENT_APPOINTMENT }}
        run: python calendly_watch.py
      - name: Save memory of what was already emailed
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add calendly_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
